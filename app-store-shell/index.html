<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MyFitPick</title>
    <style>
      :root { color-scheme: light; background: #FAF7F0; color: #171514; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 24rem; padding: 2rem; text-align: center; }
      .mark { width: 4rem; height: 4rem; margin: 0 auto 1.25rem; border-radius: 1.4rem; display: grid; place-items: center; background: #557C78; color: #FAF7F0; font-weight: 800; }
      h1 { margin: 0; font-size: 1.75rem; letter-spacing: -0.04em; }
      p { margin: 0.75rem 0 0; color: #746E67; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">MF</div>
      <h1>Opening MyFitPick</h1>
      <p>Your AI wardrobe and personal stylist.</p>
    </main>
  </body>
</html>
