name: MyFitPick CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myfitpick-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      SENTRY_AUTH_TOKEN: ""

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate deployment structure
        run: npm run deploy:check

      - name: Scan tracked files for secrets
        run: npm run test:secret-scan

      - name: Type-check
        run: npm run typecheck

      - name: Run deterministic test suite
        run: npm test

      - name: Run recommendation integrity gates
        run: |
          npm run test:recommendation-integrity
          npm run test:recommendation-persistence
          npm run test:recommendation-evaluation
          npm run test:deployment-safety

      - name: Lint
        run: npm run lint

      - name: Build production application
        env:
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
        run: npm run build

      - name: Verify build artifacts
        run: npm run deploy:verify-build
